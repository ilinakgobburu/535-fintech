name: Wheel orders

# When run: read the book the course server (Sanji) wrote, ask LSEG for that session's
# closing quotes, and write the next session's wheel order to mkt/open_orders.json (one order,
# or []). The rules are config/wheel_live.yaml; the decision is lib/wheel_live.py.
# Its nightly schedule is retired: .github/workflows/vol-arb-orders.yml now writes mkt/open_orders.json every
# weeknight. Only the Run workflow button is left, and it does nothing unless its box is ticked, since a run
# replaces the vol-arb's legs or hedge in that file (wheel_orders.py also refuses while config/vol_arb_live.yaml
# says owns_open_orders: true, unless given --overwrite-vol-arb). Both workflows share one concurrency group, so
# they never write the file at the same time.
on:
  workflow_dispatch:
    inputs:
      overwrite_vol_arb:
        description: "Replace the vol-arb strategy's orders in mkt/open_orders.json with a wheel order"
        type: boolean
        default: false

concurrency:
  group: mkt-open-orders
  cancel-in-progress: false

# The repository's default token can only read, so the commit step needs write access.
permissions:
  contents: write

jobs:
  orders:
    # Only main: a run started from another branch would rebase that branch onto main and push it.
    if: github.ref == 'refs/heads/main' && inputs.overwrite_vol_arb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages (same versions as requirements.txt)
        run: pip install lseg-data==2.1.1 pandas==2.2.3 numpy==1.26.4 scipy==1.13.1 pyyaml==6.0.3

      - name: Decide the next session's order
        id: orders
        env:
          PYTHONWARNINGS: ignore::FutureWarning   # lseg-data's pandas deprecation notices
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python wheel_orders.py --overwrite-vol-arb

      - name: Commit mkt/open_orders.json
        env:
          FOR_DAY: ${{ steps.orders.outputs.for_day }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mkt/open_orders.json
          if git diff --cached --quiet; then
            echo "mkt/open_orders.json is unchanged"
            exit 0
          fi
          git commit -m "Open orders for ${FOR_DAY}"
          # The price job or Sanji may have pushed since the checkout: replay this commit on top and retry.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          exit 1
