name: Vol-arb orders

# Every weeknight: read the book the course server (Sanji) wrote and write the next session's orders for the
# two-sided variance trade on NVDA to mkt/open_orders.json: on an entry night (the first session after a
# monthly expiry) the two option legs, on every night the stock hedge, or []. The settings are
# config/vol_arb_live.yaml; the decision is lib/vol_arb_live.py on the backtest's own lib/vol_arb*.py.
on:
  schedule:
    - cron: "0 3 * * 2-6"   # 03:00 UTC Tue-Sat = 22:00 New York Mon-Fri in winter (the instructor's 10pm), 23:00 in summer
    - cron: "0 6 * * 2-6"   # the retry, 01:00 New York in winter (02:00 in summer), before the open: it does nothing if
                            # the first run wrote tonight's orders, and decides if it failed (the entry is one night only)
  workflow_dispatch:

concurrency:
  group: vol-arb-orders
  cancel-in-progress: false

# The repository's default token can only read, so the commit step needs write access.
permissions:
  contents: write

jobs:
  orders:
    # Only main: a run started from another branch would rebase that branch onto main and push it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages (same versions as requirements.txt, plus the backtest's scikit-learn)
        run: pip install lseg-data==2.1.1 pandas==2.2.3 numpy==1.26.4 scipy==1.13.1 pyyaml==6.0.3 scikit-learn==1.5.1

      - name: Decide the next session's orders
        id: orders
        env:
          PYTHONWARNINGS: ignore::FutureWarning   # lseg-data's pandas deprecation notices
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python vol_arb_orders.py ${{ github.event.schedule == '0 6 * * 2-6' && '--retry' || '' }}

      - name: Commit mkt/open_orders.json and the ledger
        env:
          FOR_DAY: ${{ steps.orders.outputs.for_day }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mkt/open_orders.json data/vol_arb_ledger.json
          if git diff --cached --quiet; then
            echo "mkt/open_orders.json and data/vol_arb_ledger.json are unchanged"
            exit 0
          fi
          git commit -m "Open orders for ${FOR_DAY}"
          # The price job or Sanji may have pushed since the checkout: replay this commit on top and retry.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          exit 1
