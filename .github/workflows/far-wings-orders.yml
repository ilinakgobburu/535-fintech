name: Far-wing orders

# Every weeknight: read the book the course server (Sanji) wrote and write the next session's orders for the
# far-wing trade to mkt/open_orders.json, for every name of the basket (NVDA and the long/short vol book's 30 names,
# each its own $100,000 book; config/far_wings_live.yaml's names), all in the one file: on an entry night (the first
# session after a monthly expiry) each name's two short wings, a far put and a far call, as limits at the closing mid;
# on every night each name's band check, a stock hedge only when its book's net delta is outside its $5,000 band;
# or []. The settings are config/far_wings_live.yaml; the decision is lib/far_wings_live.py. This is the one writer:
# vol-arb-orders.yml and wheel-orders.yml keep only their Run buttons, and their scripts refuse outright while
# config/far_wings_live.yaml says owns_open_orders: true. With owns_open_orders: false (the far wings retired)
# far_wings_orders.py writes nothing and exits 0, so these runs stay green; delete the schedule below to stop them.
on:
  schedule:
    - cron: "0 3 * * 2-6"   # 03:00 UTC Tue-Sat = 22:00 New York Mon-Fri in winter (the instructor's 10pm), 23:00 in summer
    - cron: "0 6 * * 2-6"   # the retry, 01:00 New York in winter (02:00 in summer), before the open: it decides only the
                            # names the first run did not (data not final at 22:00, or the run failed), and does
                            # nothing if it wrote every name's orders (the entry is one night only)
                            # GitHub can start either hours late (2026-11-17: 11:23 and 15:29 UTC). The orders are
                            # always for the session after the last close; a run that starts (or would write) after
                            # that session's 09:30 open writes nothing and goes red, and nothing is committed
  workflow_dispatch:

concurrency:
  group: mkt-open-orders      # shared with vol-arb-orders.yml and wheel-orders.yml: one writer at a time
  cancel-in-progress: false

# The repository's default token can only read, so the commit step needs write access.
permissions:
  contents: write

jobs:
  orders:
    # Only main: a run started from another branch would rebase that branch onto main and push it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # an entry night asks LSEG about 1,790 times for the 31 names (0.4 s apart, about 0.58 s each: some 17 minutes);
    # 90 minutes leaves room for a slow night and still ends before the 06:00 retry
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # scikit-learn only because lib/vol_arb_live.py, whose calendar, book and order helpers the far wings reuse,
      # imports lib/vol_arb_wf.py
      - name: Install packages (same versions as requirements.txt, plus vol-arb's scikit-learn)
        run: pip install lseg-data==2.1.1 pandas==2.2.3 numpy==1.26.4 scipy==1.13.1 pyyaml==6.0.3 scikit-learn==1.5.1

      - name: Decide the next session's orders
        id: orders
        env:
          PYTHONWARNINGS: ignore::FutureWarning   # lseg-data's pandas deprecation notices
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python far_wings_orders.py ${{ github.event.schedule == '0 6 * * 2-6' && '--retry' || '' }}

      - name: Commit mkt/open_orders.json and the ledger
        env:
          FOR_DAY: ${{ steps.orders.outputs.for_day }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mkt/open_orders.json
          # the ledger is written on every night that writes orders, but not on a night that kept an order for the
          # session in progress; before its first night it does not exist yet
          if [ -f data/far_wings_ledger.json ]; then git add data/far_wings_ledger.json; fi
          if git diff --cached --quiet; then
            echo "mkt/open_orders.json and data/far_wings_ledger.json are unchanged"
            exit 0
          fi
          git commit -m "Far-wing open orders for ${FOR_DAY}"
          # The price job or Sanji may have pushed since the checkout: replay this commit on top and retry.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      # A name stopped by its own book (another strategy's position on it, a rejected order of its own, a hedge past
      # 40 x its book, positions on a conid Sanji does not track, an unexpected error on its data), or skipped at the
      # 01:00 retry because its LSEG data was still not final (its entry, or its hedge, not written), got no orders
      # while the others were written and committed above; this step turns the run red so it is seen. The log of
      # the step before says why.
      - name: Fail when a name got no orders
        if: steps.orders.outputs.stopped != '' || steps.orders.outputs.skipped != ''
        env:
          STOPPED: ${{ steps.orders.outputs.stopped }}
          SKIPPED: ${{ steps.orders.outputs.skipped }}
        run: |
          WHY="see the log of 'Decide the next session's orders' for why"
          if [ -n "${STOPPED}" ]; then
            echo "::error::No orders tonight for ${STOPPED} (stopped): ${WHY}"
          fi
          if [ -n "${SKIPPED}" ]; then
            echo "::error::No orders tonight for ${SKIPPED} (LSEG's data still not final at the 01:00 retry): ${WHY}"
          fi
          exit 1
