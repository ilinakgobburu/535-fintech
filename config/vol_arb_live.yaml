    pmcc_daily.carry: 8ca3aed48c598e373a280aac6f3740aafdcf8effb0659796b76b093bab5bc7c4
    pmcc_daily.monthly_expiries: 0dd52ab32a68d1262c002502d38b27e200d938a65df1dd85011f7ec6eba10667
    pmcc_daily.third_friday: 14f39e6c74c3b3ce15429982476cd1cc5d65b09ea32a08840bb5df9c8aef09df
    vol.DAYS_PER_YEAR: cea20a3cf9fe5686981e1ef5ef5f1548cb932760f330734817bba1e7347130a6
    vol.GREEKS: 0b690f0028ae89ac60e863aed13fa3bfa745a485db130b4e96ddc0fbb5820402
    vol.MIN_T: 7cd326255e9fd56eea4b5285a77be982483169bd6d0be066a4f95d716c4aebf7
    vol.VOL_HI: 1e4f06fea651e45cb41e306d516dd6a01ee2713260753969a8895579bceb8fad
    vol.VOL_LO: 1e4f06fea651e45cb41e306d516dd6a01ee2713260753969a8895579bceb8fad
    vol.bs_greeks: cb53aeccf626f01c7f2ceb4d2f9af865be5c75c3cefef30e5698a9389be8afac
    vol.bs_price: 3b8da14b55dc16967a9c53167bd702e8b51fba229a8a68ad0980d3650ee23b74
    vol.implied_vol: 3ce83a2cfa8afb9e5488ba8bcff73dbd3d1da2bde7f5c04527907b2701ba0eab
    wheel.CALL: 7b5a9cd2daa7f6c11f79ab186987ad7b17fc21f4e28f2ba822edcd35dd3dc252
    wheel.CONTRACT: 77bc132d1762ae8ef5eb736a742c254841bdb1708c68d3879cecb8686beee4df
    wheel.DAYS_PER_YEAR: cea20a3cf9fe5686981e1ef5ef5f1548cb932760f330734817bba1e7347130a6
    wheel.PUT: 7b5a9cd2daa7f6c11f79ab186987ad7b17fc21f4e28f2ba822edcd35dd3dc252
    wheel._num: 6e016b8d67492885f78987fd297f27ad1d7c593108e765d482d30e8e40ac187d
    wheel.option_greeks: 16da0fb1cfabf70e2a4fb54e86862ead21a0f28c88c1f8eb9be392e3cdb12956
    wheel.select: 17785699faeecab0233cbaef24f1d3b5dd0e90a5a7904d027ef2a313fd006753

acknowledged: {}      # order id: why Sanji's rejection of it, or his missing result for it, no longer stops the run.
                      # This strategy's rejected or unanswered orders stop every night until the id is here (after
                      # fixing what was wrong); the next run notes it and rewrites mkt/open_orders.json without it.
                      #   e.g.  nvda-va-put-2026-11-23: rejected, strike token fixed in 1a2b3c4; the call filled alone

live_rules:
  - >-
    Entry nights are the backtest's: the first session after each monthly expiry, trading the next monthly
    expiry. The measurement uses that session's closing quotes, as the backtest did; the orders are for the
    next session, which Sanji fills at its prices (a limit against the bar's high and low), not at the close.
    A run after that next session's open (the Run button on Tuesday morning) places no entry, only the hedge.
  - >-
    The model is fit on the development panel only (2019-23, five stocks). The registered test refits each
    month on development and finished test rows; live, neither the 2024-26 test rows nor the live cycles
    (whose labels would need the backtest's hedged P&L) are added.
  - >-
    The option orders are limits at the closing mid. If only one leg fills, the book holds one leg and is
    hedged as it stands; an unfilled entry is not placed again (the backtest enters only at the entry close).
  - >-
    The hedge is a market order for the next open, to -round(net delta) shares from D's closing deltas, as
    the backtest rebalances at each open. The new legs are hedged from the night after they appear in the
    book (the backtest hedges them at the entry close).
  - >-
    After an expiry, the leftover shares are closed at the next open (the backtest closes them at the
    expiry's close). Shares Sanji delivers on an assignment or at expiry are hedged or closed the same way.
  - >-
    The wheel's Action keeps only its Run button, which does nothing unless its overwrite box is ticked, and
    wheel_orders.py refuses while owns_open_orders is true; the two workflows share one concurrency group.
  - >-
    Every NVDA option in the book must be exactly what this strategy's filled orders add up to (its nvda-va ids in
    mkt/fills.json, looked up in data/vol_arb_ledger.json, where the script records every order it writes; the
    Action commits both files), except a short leg Sanji has assigned; NVDA shares need at least one fill of its
    own. Anything else stops the run: the wheel's last cash-secured put, if Sanji filled it before the switch, must
    be closed by hand (her own BTC order in mkt/open_orders.json) before the vol-arb trades on. With positions but
    no mkt/fills.json the book can't be checked, and the run stops too.
  - >-
    A stale book is never traded on, as in wheel_live: once mkt/fills.json exists, every order of this strategy's
    written for a session up to D needs a result there; a rejected order or an option listed on or after its
    expiry stops the run; an order for a session not yet resolved is kept and nothing is added. A rejected or
    unanswered order stops every night until she adds its id to `acknowledged` with the reason (the hand fix);
    another strategy's orders are only noted.
