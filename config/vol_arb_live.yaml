# The two-sided variance trade, live: what vol_arb_orders.py trades through the course server (Sanji).
# The strategy is config/vol_arb_ml.yaml's (part_2, amended_2026_11_15, clarified_2026_11_15, amended_2026_11_15b),
# computed by lib/vol_arb.py and lib/vol_arb_wf.py, copied byte for byte from the frozen backtest (hashes below).
# This file only says what the live script needs that the backtest did not: which rung, which panel, where the
# data comes from, and how the server's fills differ from the backtest's.

underlying:
  root: NVDA          # option RIC root
  ric: NVDA.O         # the stock on LSEG
  conid: 4815747      # Interactive Brokers' id, as in config/wheel_live.yaml (order.html asks for it)

owns_open_orders: true  # this strategy writes mkt/open_orders.json every night; wheel_orders.py refuses to run while
                        # this is true, unless given --overwrite-vol-arb (wheel-orders.yml's Run button with its box)

# The rung the development run sends to the test (its choice_for_test). rule_1 is a placeholder until that
# run records its choice; the script refuses to enter unless the panel below records the same rung.
rung: logistic        # one of rule_1, logistic, forest; set 2026-11-16 from the development run (vol_arb_ml.yaml result_dev_2026_11_16)

panel: data/vol_arb_dev_panel.json   # exported from cache/vol_arb_ml_dev.json by export_vol_arb_panel.py
panel_pin:            # the panel the live model is fit on, pinned once it is exported (export_vol_arb_panel.py prints
                      # these three lines); empty until then. An entry night stops unless all three match the file
  sha256: 355e12873373431a17c7eae396a8cb58cc2c07fb7c1b944a06125c8d3e4ee3d9   # the panel file's bytes
  dev_output_sha256: 18f1723aed4d638a7c86ddf3cacf990fca29aab12a6f8c498357382f0b8bf2ec   # cache/vol_arb_ml_dev.json's, as the panel records it (made_from.sha256)
  dev_output_commit: "f06f6ed5f550aea56a9570fcb7faf54e5e95af7f"   # the development run's commit, as the panel records it (made_from.commit)
development:          # the only rows the live model may be fit on (the 2024-26 final test is not used)
  stocks: [NVDA, AMD, DIS, COST, DAL]
  window: [2019-01-02, 2023-12-29]

registered:           # config/vol_arb_ml.yaml's numbers; the script stops if lib/vol_arb*.py says otherwise
  corridor_sd: 1.5            # |ln(K/F)| <= 1.5 x sigma_ATM x sqrt(T)
  band_put_rich_above: 0.55   # a model trades put_rich when p > 0.55,
  band_call_rich_below: 0.45  # call_rich when p < 0.45, nothing between
  target_delta: 0.25          # each leg: wheel.select()'s strike nearest 0.25 |delta|
  vega_dollars: 200           # each leg: round(200 / vega per vol point per contract) contracts, at least 1
  capital: 100000             # the book the $200 a vol point is sized for (the P&L is an overlay)
  warm_months: 24             # the panel must hold 24 entry months of finished rows
  lot: 100                    # shares per NVDA contract

limits:
  max_hedge_x_capital: 5      # the hedge's target shares, and the shares held, times D's close, may not pass
                              # 5 x capital: legs sized $200 a vol point hold about 2,400 / spot contracts each, so a
                              # leg deep in the money is about 2.4 x; contracts read as shares would be about 100 x

chain:                # the strikes asked for on an entry night, as scripts/fetch_wheel_raw.py banded the backtest
  bands:
    P: [0.70, 1.02]   # times the closes over the 7 days either side of the previous monthly expiry (up to D)
    C: [0.97, 1.40]
  grid:               # [price below which it applies, increment]: NVDA_2024's, from the 2026-11-11 probe
    - [150, 1.0]
    - [300, 2.5]
    - [null, 10.0]
  history_days: 14    # each option's daily BID/ASK asked for over the 14 days up to D; only D's row is used
  min_dated_share: 0.9  # stop (data not final) unless this share of the listed contracts has a D row. At 22:00 any
                        # listed contract with earlier rows but none for D stops the run too (LSEG part-way through
                        # D); the 01:00 retry measures without such contracts, as the backtest measured its holes.
                        # Only LSEG's "The universe is not found" counts as not listed

data:
  closes_days: 200            # NVDA.O TRDPRC_1 and OPEN_PRC, unadjusted (exchangeCorrection), 200 calendar days
                              # up to D: 63 returns for the semivariances, 21 for rv21 and ret21, plus slack
  dividends_days: 400         # TR.DivExDate / TR.DivUnadjustedGross: the trailing year's yield and ex-dates
  rate_ric: US3MT=RR          # 3-month T-bill, MID_YLD_1, as in the backtest
  leg_history_days: 45        # a held leg's daily BID/ASK, for its last usable mid
  vix_csv: https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv
  vix_fallback_ric: .VIX      # its TRDPRC_1 close on D, only when Cboe's file lacks D or cannot be read (the
                              # backtest read Cboe's file; null turns the fallback off)
  min_days_between_reports: 80  # when TR.ExpectedReportDate has not rolled past D: a report inside the cycle is
                                # ruled out only if the last actual report was within this many days of the expiry

