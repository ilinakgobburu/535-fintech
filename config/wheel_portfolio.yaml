# The user chose five $100,000 wheels side by side over one shared account. Nothing is chosen from these
# results: they describe what diversification does to the wheel, and the page stays on Mastercard alone.
registered: 2026-10-27

books: >
  the plain hold-to-expiry wheel on MA, APA, V, FISV and ADI, each from $100,000 at its committed pick
  (config/wheel_mr_picks), run exactly as before; the portfolio is their daily account values added
  together, $500,000 to start. A session one stock lacks carries that stock's last value
