# Fold 2 of the stock walk-forward (config/wf_screen.yaml): the wheel on the stock that fold's screen
# picks, its setting trained from 2024-01-02 to 2025-12-31 and judged on 2026-01-02 to 2026-10-16. Registered
# with config/wf_screen.yaml, before the screen runs; the stock is added below, under a dated key, once
# the screen has picked it and before any option pull or training run for it.
registered: 2026-10-28

rules: config/wheel.yaml's rules, fills, grid, baseline, selection, benchmarks, reported and
  decision, unchanged, as in config/wheel_mr.yaml

windows:
  train: {start: 2024-01-02, end: 2025-12-31}
  test: {start: 2026-01-02, end: 2026-10-16}
  each_window: starts from $100,000 in cash

grid:   # as config/wheel.yaml
  put_delta: [0.15, 0.25, 0.35]
  call_delta: [0.15, 0.25, 0.35]
  floor: [true, false]
baseline:
  setting: {put_delta: 0.25, call_delta: 0.25, floor: true}
selection:
  score: Sharpe ratio on the training window at mid fills
  ties: to 4 decimals, the earlier setting in the grid's order
  record: config/wheel_wfs_2026_picks/{TICKER}.json, committed before this fold's test stage is run

underlyings: {}   # filled under a dated key once config/wf_screen.yaml has picked this fold's stock

added_2026_10_28:   # cache/wf_screen.json's pick for this fold, recorded before any check or training run here
  APA: {ric: APA.OQ, cache: cache/wheel_raw_APA_2024, rank: 1, vr: 0.562, rho: -0.351}
  note: >
    ranked first, with nothing above it skipped; ADI (2) and MA (3) are the follow-ups. APA's options for 2024-01-02 to 2026-10-16
    are already cached from the class run, so nothing is pulled. Its 2024-2025 training grid and its
    2026 test were seen in the class run (config/wheel_mr.yaml)
