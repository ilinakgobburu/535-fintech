# The wheel's class run: the five stocks config/mr_screen.yaml picks, on a window nothing in this
# project has touched (2024-2026). The windows, the train/test split, the screen and the count of
# five were chosen by the user on 2026-10-26. Registered before the screen or any of these series
# is pulled; the stocks are added below, under a dated key, when the screen has picked them.
registered: 2026-10-26

rules: config/wheel.yaml's rules, fills, grid, baseline, selection, benchmarks, reported and
  decision, unchanged (monthlies, $100,000 of cash, whole contracts, mid with a bid stress test,
  T-bill interest on cash, earnings sold through, Sharpe at mid picks per stock, ties to the earlier setting)

windows:
  train: {start: 2024-01-02, end: 2025-12-31}   # about 23 monthly cycles to pick on
  test: {start: 2026-01-02, end: 2026-10-16}    # about 9 cycles, the last monthly expiry before the run
  each_window: starts from $100,000 in cash
  test_noise: about 9 cycles is a short test; its Sharpe ratios carry wide error and are reported as such

grid:   # as config/wheel.yaml
  put_delta: [0.15, 0.25, 0.35]
  call_delta: [0.15, 0.25, 0.35]
  floor: [true, false]
baseline:
  setting: {put_delta: 0.25, call_delta: 0.25, floor: true}
selection:
  score: Sharpe ratio on the training window at mid fills
  per_stock: each stock gets its own pick, recorded in config/wheel_mr_picks before its test window is run

data:
  pull: scripts/fetch_wheel_raw.py, a cache per stock under cache/wheel_raw_{TICKER}_2024, the same
    bands (puts 0.70-1.02, calls 0.97-1.40 times spot), contracts expiring inside the window only
  strike_grid: >
    by the price of the day, every $0.50 under $25, $1 under $100, $5 under $300 and $10 above: one
    rule for every stock, from the AMD, DIS and COST probes, so no stock-by-stock probe is needed.
    A coarser grid than a stock lists costs precision in delta, not data

underlyings: {}   # filled under a dated key once config/mr_screen.yaml has run

added_2026_10_26:   # config/mr_screen.yaml's output (cache/mr_screen.json), recorded before any option pull for these
  MA: {ric: MA.N, cache: cache/wheel_raw_MA_2024, rank: 1, vr: 0.572, rho: -0.175}
  APA: {ric: APA.OQ, cache: cache/wheel_raw_APA_2024, rank: 2, vr: 0.580, rho: -0.344}
  V: {ric: V.N, cache: cache/wheel_raw_V_2024, rank: 3, vr: 0.580, rho: -0.193}
  FISV: {ric: FISV.OQ, cache: cache/wheel_raw_FISV_2024, rank: 5, vr: 0.582, rho: -0.217, options: FI until the October 2025 expiry, FISV after}
  ADI: {ric: ADI.OQ, cache: cache/wheel_raw_ADI_2024, rank: 6, vr: 0.587, rho: -0.301}
  skipped: >
    BDX (rank 4): its contracts were adjusted on 2026-02-10 for something other than a split.
    BKNG (rank 7): it closed above $950 (its 25-for-1 split of 2026-04-06 was also flagged as a
    non-split adjustment, because 25 is not on the screen's list of split ratios; the price rule
    excludes it either way)
  follow_ups: MRSH.N (Marsh McLennan, rank 8) and AON.N (rank 9), run only if asked or if a pick fails the data check
  context: >
    396 of the 469 eligible stocks (84%) had a negative monthly autocorrelation over 2014-2023 and
    the median variance ratio was 0.84, so reversal was common across the market in that decade, not
    only in these five. The five scored 0.572-0.587 against 0.600 for the tenth, a spread well inside
    the measure's noise of about 0.14

added_2026_10_28_benchmark:   # chosen by the user after the test was run; it is reported, and nothing is chosen from it
  index: Cboe S&P 500 PutWrite Index (PUT)
  what_it_is: >
    sells a one-month at-the-money S&P 500 put each month, fully secured by cash held in T-bills: the
    industry's standard for systematic cash-secured put selling, with no stock picking and no covered calls.
    Like the wheel here, its collateral earns T-bill interest
  source: >
    Cboe's published daily history (cdn.cboe.com/api/global/us_indices/daily_prices/PUT_History.csv),
    saved to cache/cboe/PUT_History.csv on 2026-10-28; LSEG does not license Cboe index data to this
    account (TS.Interday.UserNotPermission for .PUT). Its returns over both windows were looked at to check
    the data before this entry was written
  book: $100,000 at each window's first session, scaled by the index's closing level, on the wheel's sessions
  reported: return, Sharpe ratio (as config/wheel.yaml defines it), maximum drawdown and volatility, beside the wheel, buy and hold and T-bills
