# The far-wing trade, live: what far_wings_orders.py trades through the course server (Sanji).
# Her choices (2026-11-16): sell far puts (|delta| under 0.10) and far calls (|delta| under 0.05), delta-hedged with
# the stock only when the book's net delta leaves a band ("Hedge less often (delta bands)"), no crash cap ("Hedge
# only"), limits at the mid ("Yes, limits at the mid"), and this becomes the class algorithm ("Yes, switch to far
# wings"): the nightly script switches from the vol-arb. The rules are lib/far_wings_live.py; the numbers below are
# checked against it before anything runs.
#
# The basket (her choices of 2026-11-17, asked "why cant you do more than nvda?"): "The 30-stock basket" and "$100k
# book per stock". NVDA stays, and the long/short vol book's registered draw of 2026-11-17 (ranks 1-30, below in rank
# order) joins it: 31 names, each its own independent $100,000 book under exactly NVDA's rules (the same wings, size,
# limits at the mid, its own $5,000 band and its own 40 x hedge limit, held to expiry; entry the first session after
# each monthly expiry, the next on 2026-11-23). No pooling across names and no new rule. These 30 names were NOT in
# the far-wing backtest, which used 11 stocks: their live results are out of sample in names as well as in time.

