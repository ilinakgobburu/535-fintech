acknowledged: {}      # order id: why Sanji's rejection of it, or his missing result for it, no longer stops the run.
                      # A name's rejected order stops that name every night until the id is here (after fixing what
                      # was wrong); any name's unanswered order stops every name. The next run notes it and rewrites
                      # mkt/open_orders.json without it.
                      #   e.g.  nvda-fw-put-2026-11-23: rejected, strike token fixed in 1a2b3c4; the call filled alone
                      #         brkb-fw-call-2026-12-21: no result from Sanji for the session; the book shows no fill

technical_choices:    # Claude's, each with its reason, for her to scan (the backtest registration lists the same)
  calendar: >-
    vol-arb's entries: the first session after each monthly expiry, each position held to the next monthly expiry's
    close. Same monthly cycle as the evidence.
  wings: >-
    one strike per wing: the two-sided put with |delta| under 0.10 closest to 0.05 (tie to the lower strike), the
    two-sided call with |delta| under 0.05 closest to 0.03 (tie to the higher strike), deltas from each option's own
    closing mid (wheel.option_greeks). No eligible strike: no position in that wing that cycle. One strike per wing
    keeps orders and spread costs low; 0.05 lies between the two far-put zones that earned most before costs, 0.03
    inside the far-call zone.
  size: >-
    each wing round(200 / its Black-76 vega per vol point per contract, with the entry's lot), at least 1, on a
    $100,000 book: the scale of the earlier studies, about $200 per vol point per wing.
  fills: >-
    each wing SHT with a limit at the entry close's mid (to the cent), for the next session: her limit-at-mid choice.
  hedge: >-
    each night options are held, the net delta in shares (options from their closing mids, carried IV when a mid is
    missing, plus shares); when |net delta x close| is above $5,000 (5% of the book), a market order re-hedges to zero
    shares-delta at the next open, otherwise no hedge trade. Hedging less often cuts share-trading costs; 5% of the
    book is a plain, explainable band.
  hedge_limit: >-
    40 x the book (limits above), not vol-arb's 5: the far wings' hedge can legitimately reach about 15 x after a
    large rise, and the limit is there to catch a misread book, not to cap the hedge.
  basket_grids: >-
    each new name's strike increment from a small probe of its Dec 18 2026 monthly chain (2026-11-17, 383 requests in
    all, paced 0.4 s): near spot and in both wing zones (about 0.85 and 1.15 times spot), the step that holds every
    strike found listed there (the largest common step: $5 for most, $10 for JNJ and UNH, $2.50 for WFC, KO and CSCO,
    $0.50 for BAC and VZ, whose $1 strikes below spot and $2.50 strikes above it share no larger step). The step is
    made finer where the probe could have missed a listed strike: $0.50 for PFE, T and CMCSA (the probe asked none
    of their x.50 strikes that are $2.50 multiples, and VZ lists such strikes beside its $1 ones); $0.50 for INTC and
    $2.50 for ORCL and DIS (the probe rounded the 0.85x zone to $10, above where their 0.05 puts fall: below $50 for
    INTC and below $100 for ORCL and DIS, where the names probed list $1 and $2.50 strikes). A finer step than
    listed costs only never-listed requests (LSEG's 70005, "The universe is not found", which the script counts as
    not listed); a coarser one would hide listed strikes from the rule. WMT's, PEP's and MRK's put bands also reach
    below $100 on their $5 steps, but their wings sit near 110-130; probe them if they fall toward $100. Not
    checked: a strike of $1,000 or more, whose RIC lib/ric.build_option_ric writes with six strike digits; the call
    band (1.40 x) reaches it once MA, META or MSFT trade above about $715 (MA's reached $930 in the probe), and if
    LSEG writes such RICs another way those strikes count as not listed, so probe one before then.
  one_file: >-
    the night's orders for every name go into one mkt/open_orders.json (one writer, as before), in config order, and
    the ledger keeps each name apart (data/far_wings_ledger.json, far_wings_ledger/2: each name's orders and nights).
    The T-bill is asked for once a night; everything else per name, in config order, in one LSEG session. An order of
    her own for a session after D stays in the file as written (her BTC or SEL closing another strategy's position by
    hand, which a stopped name waits for, is not dropped because the other names were written). The vol-arb's and the
    wheel's own orders (ids <root>-va-, -csp-, -cc-) leave the file as before, and so does any order for a session up
    to D.
  name_by_name: >-
    one name's trouble never stops the others, except where the whole book is in doubt. A name whose LSEG data is not
    final at 22:00 (its close, its chain, a held leg's quotes, any LSEG error on its requests) is left for the 01:00
    retry, which decides only the names not yet decided that night; still not final then, it is skipped with a note
    (no entry this cycle, as no eligible strike is) and the run ends red, as the cycle's entry (or the night's hedge)
    was lost. A request LSEG fails on is asked once more first, 5 s later. A name whose own book does not add up
    (another strategy's position on its conid, a rejected order of its own, a fill its ledger lacks, its hedge past
    40 x its book), or whose data or plan raises an unexpected error, gets no orders, keeps its orders in the file,
    and the run ends red after the commit. Every name stops, with nothing written, only when the book file itself is
    in doubt (an order of this strategy's with no result, an option listed past its expiry, an unreadable file),
    when the LSEG login or the T-bill fails (every name's rate), or when no name could be decided at all (as the
    single-name script stopped when NVDA's data was not final).

live_rules:
  - >-
    Entry nights are the backtest's: the first session after each monthly expiry, selling that cycle's two wings of
    the next monthly expiry from that session's closing quotes. The orders are for the next session, which Sanji
    fills at its prices (a limit sell fills when the bar's high reaches it), not at the close. The backtest's headline
    fill takes the next session's closing mid instead (filled when it is at least the limit). A run after that next
    session's open (the Run button on Tuesday morning) places no entry, only the band check.
  - >-
    An unfilled wing is not placed again that cycle (the backtest enters only once a cycle); the other wing trades
    and is hedged as it stands.
  - >-
    The band is checked every night options are held, from D's closing deltas, the first time on the night the new
    wings appear in the book; a breach is a market order for the next open, as the backtest re-hedges at the next
    open. At exactly $5,000 nothing is done.
  - >-
    Sanji assigns a short option on any close through its strike (order.html section 11); the backtest has no early
    exercise. Delivered shares are hedged with the rest; with no options left the shares are closed at the next open.
  - >-
    After an expiry the leftover shares are closed at the next open (the backtest closes them at the expiry's close).
  - >-
    Name by name, every option the book holds on a name's conid must be exactly what that name's filled orders add up
    to (its <ticker>-fw ids in mkt/fills.json, looked up in its part of data/far_wings_ledger.json, where the script
    records every order it writes; the Action commits both files), except a short leg Sanji has assigned; its shares
    need at least one fill of its own. Anything else stops that name: another strategy's position on it (the wheel's
    last NVDA put, a vol-arb leg) must be closed by hand (her own BTC or SEL order in mkt/open_orders.json) first. With
    positions but no mkt/fills.json a name's book can't be checked, and that name stops too. Positions on another
    conid are not this strategy's and are left alone.
  - >-
    A stale book is never traded on: once mkt/fills.json exists, every order of this strategy's (any name's) written
    for a session up to D needs a result there, or every name stops; so does an option listed on or after its expiry.
    An order for a session not yet resolved is kept and nothing is added. A name's rejected order stops that name
    until she adds its id to `acknowledged` with the reason; another strategy's orders are only noted.
  - >-
    Sanji prices only the conids price_history.json tracks (tracked: true), so a name whose conid is not there, or is
    null in names (none is today: all 31 were confirmed by matching IB's ISIN to LSEG's), gets no orders that night;
    if it holds positions, the run ends red, as its hedge was not written.
  - >-
    The vol-arb and wheel Actions keep only their Run buttons, and while owns_open_orders is true here
    vol_arb_orders.py and wheel_orders.py refuse outright (no flag gets past it), so a click can never write orders
    that the next far-wing run would silently replace, or that would silently replace the far wings'. All three
    workflows share one concurrency group (mkt-open-orders). With owns_open_orders false, far_wings_orders.py writes
    nothing and exits 0.
