owns_open_orders: true  # this strategy writes mkt/open_orders.json every night (.github/workflows/far-wings-orders.yml).
                        # While this is true, vol_arb_orders.py and wheel_orders.py both refuse outright (no flag gets
                        # past it), so this is the file's one writer. Set it to false (and commit it) to retire the
                        # far wings: far_wings_orders.py then writes nothing and ends green (exit 0) with a note, so
                        # the two scheduled runs a night stay green; delete the schedule in far-wings-orders.yml too to
                        # stop them running at all. Only then can the vol-arb's or the wheel's Run button write

registered:           # lib/far_wings_live.py's numbers; the script stops if the two disagree
  put_max_abs_delta: 0.10       # the put wing: two-sided puts with |delta| strictly under 0.10 ...
  put_target_abs_delta: 0.05    # ... the one closest to 0.05 (a tie to the lower strike)
  call_max_abs_delta: 0.05      # the call wing: two-sided calls with |delta| strictly under 0.05 ...
  call_target_abs_delta: 0.03   # ... the one closest to 0.03 (a tie to the higher strike)
  vega_dollars: 200             # each wing: round(200 / Black-76 vega per vol point per contract), at least 1
  capital: 100000               # EACH name's book, which its $200 a vol point and its band are sized on (the P&L
                                # is an overlay); 31 names are 31 books of $100,000, never pooled
  band_share_of_book: 0.05      # re-hedge a name to zero shares-delta when ITS |net delta x close| > 5% of its book
                                # ($5,000 a name)
  lot: 100                      # shares per contract; every name's lot must be this

limits:
  max_hedge_x_capital: 40     # a name's hedge target shares, and the shares it holds, times D's close, may not
                              # pass 40 x its own book. Far wings at $200 a vol point are many contracts (about 20,000 / (spot x
                              # pdf(d1) x sqrt(T)) shares a wing: some 3,500 put and 5,500 call shares at $180): a
                              # 0.03-delta call deep in the money after a 50% rise needs a hedge of about 15 x the
                              # book, so vol-arb's 5 would stop the run exactly then; a book misread 100 times is far
                              # past 40

chain:                # the strikes asked for on an entry night, banded as the backtest's caches were
                      # (scripts/fetch_wheel_raw.py, the same bands as config/vol_arb_live.yaml), so the live wing is
                      # chosen from the strikes the backtest could choose from. In a high-vol month the 0.05 put or
                      # the 0.03 call can lie outside the band; then, as in the backtest, the wing is the eligible
                      # strike nearest the target that the band holds. The bands are every name's; each name's
                      # increment is its own grid (names). Requests on an entry night, from the 2026-11-17 probe's
                      # closes: about 1,790 for all 31 names (the chains 1,723, from WMT's 24 to INTC's 121, and a
                      # close and a dividends request a name, and one T-bill), each paced 0.4 s, about 0.58 s apiece in
                      # the probe: some 17 minutes. A request LSEG fails on (anything but "The universe is not found")
                      # is asked once more 5 s later, so a failing request costs at most two, and a name stops at its
                      # first request that fails twice. LSEG's daily limit is about 10,000 requests, so the 01:00
                      # retry (about 3,600 with the 22:00 run, were both full) and a Run button the same day stay
                      # well inside it; the bands are not narrowed
  bands:
    P: [0.70, 1.02]   # times the closes over the 7 days either side of the previous monthly expiry (up to D)
    C: [0.97, 1.40]
  history_days: 14    # each option's daily BID/ASK asked for over the 14 days up to D; only D's row is used
  min_dated_share: 0.9  # stop (data not final) unless this share of the listed contracts has a D row. At 22:00 any
                        # listed contract with earlier rows but none for D stops the run too (LSEG part-way through
                        # D); the 01:00 retry chooses without such contracts. Only LSEG's "The universe is not found"
                        # counts as not listed

data:
  closes_days: 70             # each name's TRDPRC_1 (its ric), unadjusted (exchangeCorrection), 70 calendar days up to D: the
                              # strike band's window and the closes of each held leg's 45 days of quotes
  dividends_days: 400         # TR.DivExDate / TR.DivUnadjustedGross: the trailing year's yield (wheel.carry)
  rate_ric: US3MT=RR          # 3-month T-bill, MID_YLD_1, as in the backtest; asked for once a night, for every name
  leg_history_days: 45        # a held leg's daily BID/ASK, for its last usable mid (at most 30 sessions back)

